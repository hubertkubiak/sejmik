# Loaded IN ADDITION to src/main/resources/application.properties and overrides it
# (Spring Boot reads both classpath:/ and classpath:/config/, the latter wins).
# Tests use a fresh in-memory database, so they never touch the developer's ./data files.
# DB_CLOSE_DELAY=-1 keeps the database alive for the whole Spring context, not just one connection.
spring.datasource.url=jdbc:h2:mem:liberum-veto-test;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=false
