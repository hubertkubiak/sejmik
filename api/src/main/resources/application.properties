spring.application.name=liberum-veto-api
server.port=8080

# H2 stored in a file, so games survive a restart. AUTO_SERVER lets the H2 console (or another
# tool) open the same file while the application is running. WRITE_DELAY=0 writes every commit to
# disk at once (default: up to 0.5 s later), so even a killed process does not lose the last move.
spring.datasource.url=jdbc:h2:file:./data/liberum-veto;AUTO_SERVER=TRUE;WRITE_DELAY=0
spring.datasource.username=sa
spring.datasource.password=

# Hibernate creates and updates tables from the entities. Convenient in development;
# a real production database would use versioned migrations (Flyway / Liquibase) instead.
spring.jpa.hibernate.ddl-auto=update

# Off on purpose: the database session ends together with the @Transactional service method,
# not at the end of the HTTP request. Lazy loading outside the service fails fast instead of
# silently running extra queries in the controller.
spring.jpa.open-in-view=false

# http://localhost:8080/h2-console (JDBC URL as above, user "sa", empty password); dev only
spring.h2.console.enabled=true

# Origins allowed to call the API from a browser (the Angular dev server). Comma-separated.
liberumveto.cors.allowed-origins=http://localhost:4200

# Swagger UI: http://localhost:8080/swagger-ui.html, OpenAPI JSON: /v3/api-docs
springdoc.swagger-ui.operations-sorter=method
